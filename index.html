<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="favicons/checklist.png" type="image/x-icon">
</head>
<body>
    <!-- ImagePicker Component(start) -->
    <div class="d-flex">
        <div class="dropdown mb-2 mr-5 ml-auto">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Background
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <a class="dropdown-item" href="#" id="selectOption">Choose Image</a>
                <a class="dropdown-item" href="#" id="resetOption">Reset to Default</a>
            </div>
        </div>
    </div>
    <!-- Hidden file input for choosing an image -->
    <input type="file" id="image_uploads" name="image_uploads" accept=".jpg, .jpeg, .png" style="display: none;" />
    <!-- ImagePicker Component(end) -->

    <main>
        <h1>Reminders</h1>
        <div id="listContainer">
            <!-- to-do generation container -->
            <ul id="todoZone" class="list-group">
                
                
            </ul>
        </div>
        <div id="addInput" style="margin-top: 10px;" class="hidden">
            <label for="todoInput" style="width: 210px; margin-left: 20px;">Add Reminder &nbsp;</label>
            <input type="text" name="todoInput" id="todoInput" class="form-control">
            <button id="add2" class="btn btn-outline-success">Add Reminder</button>
        </div>
        <button id="add" class="btn btn-outline-primary shown">Add Reminder</button>
    </main>
    <!-- <input type="checkbox" id="secureEdit"> Enable Secure Edit -->
    <div id="secureEditContainer">
        <div id="secureEditBox">
            <input type="checkbox" id="secureEdit"> Enable Secure Edit
        </div>
    </div> 
    
    <!-- if I put this live: I must attribute the creator of the favicon -->
    <!-- checklist -->
    <!-- <a href="https://www.flaticon.com/free-icons/to-do-list" title="to do list icons">To do list icons created by Graphics Plazza - Flaticon</a> -->

    <!-- Main JS module, no need to import other scripts here, it works(imports) behind the scenes -->
    <script type="module" src="js/main.js"></script>

    <!-- Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
